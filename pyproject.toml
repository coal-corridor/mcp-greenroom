[project]
name = "mcp-greenroom"
version = "0.1.0"
description = "A vetted registry for MCP servers, built as a thin slice."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13.9",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "cisco-ai-mcp-scanner==4.8.7",
]

[project.scripts]
mcp-greenroom = "mcp_greenroom.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-jsonschema",
]

[tool.uv.audit]
# litellm arrives only through cisco-ai-mcp-scanner, which pins it exactly (==1.93.2).
# Both advisories are in the LiteLLM proxy server, which this project never runs: only the
# scanner's YARA engine is used. Record: evidence/decisions.md. Remove when the scanner moves on.
ignore = [
    "GHSA-g5ff-637f-6q2m",
    "GHSA-7hp6-4w63-5g45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_greenroom"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/W: pycodestyle and pyflakes. I: imports. B: bugbear. UP: pyupgrade.
# S: flake8-bandit, the security set. N: naming. SIM: simplify.
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Plain assert is how pytest checks.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mcp_greenroom"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
